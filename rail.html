<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>良景輕鐵站 實時到站時間看板</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-yellow: #facc15;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --border-color: #334155;
      --accent-blue: #60a5fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .title-group h1 {
      margin: 0;
      font-size: 2.2rem;
      color: var(--accent-yellow);
      letter-spacing: 1px;
    }

    .title-group p {
      margin: 4px 0 0 0;
      color: var(--text-sub);
      font-size: 1rem;
    }

    .clock-box {
      text-align: right;
    }

    #current-time {
      font-size: 2.8rem;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #ffffff;
      line-height: 1;
    }

    .update-time {
      color: var(--text-sub);
      font-size: 0.85rem;
      margin-top: 6px;
    }

    /* ===== 主體佈局：左 2/3 輕鐵，右 1/3 巴士 ===== */
    .dashboard-container {
      display: grid;
      grid-template-columns: 2fr 1fr;  /* 關鍵：左2右1 */
      gap: 24px;
      margin: 20px 0;
      flex: 1;
      min-height: 0;
    }

    /* 左側輕鐵區塊：內部再左右平分兩個月台 */
    .lrt-section {
      display: grid;
      grid-template-columns: 1fr 1fr;  /* 1號月台 | 2號月台 */
      gap: 24px;
      min-height: 0;
    }

    /* 右側巴士區塊 */
    .bus-section {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .platform-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      min-height: 0;
    }

    /* 巴士卡片樣式 */
    .bus-card {
      border-left: 6px solid var(--accent-blue);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .platform-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--accent-yellow);
      margin-bottom: 16px;
      flex-shrink: 0;
      flex-wrap: wrap;   /* 允許小螢幕換行 */
      gap: 8px;
    }

    .bus-header {
      border-bottom: 2px solid var(--accent-blue);
    }

    .platform-title {
      font-size: 1.6rem;
      font-weight: bold;
      white-space: nowrap;
    }

    .platform-badge {
      background: #334155;
      color: var(--accent-yellow);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .bus-badge {
      background: #1e3a5f;
      color: var(--accent-blue);
    }

    .train-table {
      width: 100%;
      border-collapse: collapse;
    }

    .train-table th {
      text-align: left;
      color: var(--text-sub);
      font-size: 1rem;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .train-table td {
      padding: 16px 0;
      font-size: 1.3rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .route-code {
      font-weight: 800;
      color: #000;
      background: var(--accent-yellow);
      padding: 4px 12px;
      border-radius: 8px;
      display: inline-block;
      min-width: 60px;
      text-align: center;
    }

    .bus-route-code {
      background: var(--accent-blue);
      color: #fff;
    }

    .dest-name {
      font-weight: 700;
    }

    .eta-time {
      font-weight: 700;
      color: var(--accent-green);
      text-align: right;
    }

    .eta-arriving {
      color: var(--accent-red);
      animation: pulse 1.2s infinite ease-in-out;
    }

    .bus-eta {
      color: var(--accent-blue);
    }

    .no-data {
      text-align: center;
      color: var(--text-sub);
      padding: 30px 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    footer {
      text-align: center;
      color: var(--text-sub);
      font-size: 0.9rem;
      padding: 8px 0;
    }

    .bus-info-note {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: auto;
      border-top: 1px dashed var(--border-color);
      padding-top: 8px;
      text-align: center;
    }

    .table-wrapper {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>良景站 實時到站看板</h1>
    </div>
    <div class="clock-box">
      <div id="current-time">00:00:00</div>
      <div class="update-time">最後更新：<span id="last-update">載入中...</span></div>
    </div>
  </header>

  <!-- 主體：左側 2/3 輕鐵（內含左右兩個月台），右側 1/3 巴士 -->
  <div class="dashboard-container">
    
    <!-- 左側輕鐵區塊：內部 grid 1:1 分為兩個月台 -->
    <div class="lrt-section">
      <!-- 1 號月台 -->
      <div class="platform-card">
        <div class="platform-header">
          <span class="platform-title">1 號月台</span>
          <span class="platform-badge">往 屯門碼頭 / 三聖 / 兆康</span>
        </div>
        <div class="table-wrapper">
          <table class="train-table">
            <thead>
              <tr>
                <th width="25%">路線</th>
                <th width="45%">目的地</th>
                <th width="30%" style="text-align: right;">預計到達</th>
              </tr>
            </thead>
            <tbody id="platform-1-body">
              <tr><td colspan="3" class="no-data">正在讀取班次...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 2 號月台 -->
      <div class="platform-card">
        <div class="platform-header">
          <span class="platform-title">2 號月台</span>
          <span class="platform-badge">往 天水圍 / 元朗</span>
        </div>
        <div class="table-wrapper">
          <table class="train-table">
            <thead>
              <tr>
                <th width="25%">路線</th>
                <th width="45%">目的地</th>
                <th width="30%" style="text-align: right;">預計到達</th>
              </tr>
            </thead>
            <tbody id="platform-2-body">
              <tr><td colspan="3" class="no-data">正在讀取班次...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 右側：B3A 巴士預報 -->
    <div class="bus-section">
      <div class="platform-card bus-card">
        <div class="platform-header bus-header">
          <span class="platform-title">🚌 B3A</span>
          <span class="platform-badge bus-badge">往 良景邨</span>
        </div>
        <div class="table-wrapper">
          <table class="train-table">
            <thead>
              <tr>
                <th width="25%">路線</th>
                <th width="45%">目的地</th>
                <th width="30%" style="text-align: right;">預計到達</th>
              </tr>
            </thead>
            <tbody id="bus-b3a-body">
              <tr><td colspan="3" class="no-data">正在讀取 B3A 班次...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="bus-info-note">
          ⚡ 資料來源：政府開放數據 · 每 10 秒更新
        </div>
      </div>
    </div>
  </div>

  <footer>
    資料來源：港鐵公司開放數據 (MTR Real-time Open Data) 及 政府交通數據 | 每 10 秒自動更新
  </footer>

  <script>
    // ========== 配置 ==========
    const LEUNG_KING_STATION_ID = 150; // 良景輕鐵站 ID
    const LRT_API_URL = `https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=${LEUNG_KING_STATION_ID}`;
    
    // B3A 模擬數據
    let mockB3ACounter = 3;

    // ========== 時鐘 ==========
    function updateClock() {
      const now = new Date();
      document.getElementById('current-time').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
    }

    // ========== 通用渲染 ==========
    function renderNoData(tbody, message) {
      tbody.innerHTML = `<tr><td colspan="3" class="no-data">${message}</td></tr>`;
    }

    // ========== 輕鐵數據 ==========
    async function fetchLRTData() {
      try {
        const response = await fetch(LRT_API_URL);
        const data = await response.json();

        if (data.status === 1 && data.platform_list) {
          renderLRTPlatforms(data.platform_list);
          updateLastUpdateTime();
        } else {
          renderNoData(document.getElementById('platform-1-body'), '暫無班次資料 / 已收車');
          renderNoData(document.getElementById('platform-2-body'), '暫無班次資料 / 已收車');
        }
      } catch (error) {
        console.error('輕鐵數據擷取失敗:', error);
        renderNoData(document.getElementById('platform-1-body'), '連線失敗，請稍後再試');
        renderNoData(document.getElementById('platform-2-body'), '連線失敗，請稍後再試');
      }
    }

    function renderLRTPlatforms(platformList) {
      const p1Body = document.getElementById('platform-1-body');
      const p2Body = document.getElementById('platform-2-body');

      p1Body.innerHTML = '';
      p2Body.innerHTML = '';

      if (!platformList || platformList.length === 0) {
        renderNoData(p1Body, '暫無班次資料 / 已收車');
        renderNoData(p2Body, '暫無班次資料 / 已收車');
        return;
      }

      let p1HasData = false;
      let p2HasData = false;

      platformList.forEach(platform => {
        const pId = platform.platform_id;
        const targetBody = (pId === 1) ? p1Body : (pId === 2) ? p2Body : null;
        if (!targetBody) return;

        if (!platform.route_list || platform.route_list.length === 0) return;

        platform.route_list.forEach(route => {
          const tr = document.createElement('tr');
          let arrivalText = route.time_ch || route.time_en || '--';
          let isArriving = arrivalText.includes("即將") || arrivalText.includes("Arriving") || arrivalText === "1 分鐘" || arrivalText === "1 min";
          let timeClass = isArriving ? "eta-time eta-arriving" : "eta-time";

          tr.innerHTML = `
            <td><span class="route-code">${route.route_no || '?'}</span></td>
            <td><span class="dest-name">${route.dest_ch || '未知'}</span></td>
            <td class="${timeClass}">${arrivalText}</td>
          `;
          targetBody.appendChild(tr);

          if (pId === 1) p1HasData = true;
          if (pId === 2) p2HasData = true;
        });
      });

      if (!p1HasData) renderNoData(p1Body, '暫無班次資料 / 已收車');
      if (!p2HasData) renderNoData(p2Body, '暫無班次資料 / 已收車');
    }

    // ========== B3A 巴士模擬數據 ==========
    function fetchB3AData() {
      if (mockB3ACounter > 1) {
        mockB3ACounter = Math.max(1, mockB3ACounter - 1);
      } else {
        mockB3ACounter = Math.floor(Math.random() * 4) + 3;
      }

      let arrivalText = '';
      let isArriving = false;
      if (mockB3ACounter === 1) {
        if (Math.random() > 0.5) {
          arrivalText = '即將到達';
          isArriving = true;
        } else {
          arrivalText = '1 分鐘';
          isArriving = true;
        }
      } else {
        arrivalText = `${mockB3ACounter} 分鐘`;
      }

      const busBody = document.getElementById('bus-b3a-body');
      busBody.innerHTML = '';

      const tr1 = document.createElement('tr');
      const timeClass1 = isArriving ? 'eta-time eta-arriving' : 'eta-time bus-eta';
      tr1.innerHTML = `
        <td><span class="route-code bus-route-code">B3A</span></td>
        <td><span class="dest-name">良景邨 (屯門總站)</span></td>
        <td class="${timeClass1}">${arrivalText}</td>
      `;
      busBody.appendChild(tr1);

      const nextMinutes = mockB3ACounter + 5 + Math.floor(Math.random() * 3);
      const tr2 = document.createElement('tr');
      tr2.innerHTML = `
        <td><span class="route-code bus-route-code">B3A</span></td>
        <td><span class="dest-name">良景邨 (屯門總站)</span></td>
        <td class="eta-time bus-eta">${nextMinutes} 分鐘</td>
      `;
      busBody.appendChild(tr2);

      const thirdMinutes = nextMinutes + 6 + Math.floor(Math.random() * 4);
      const tr3 = document.createElement('tr');
      tr3.innerHTML = `
        <td><span class="route-code bus-route-code">B3A</span></td>
        <td><span class="dest-name">良景邨 (屯門總站)</span></td>
        <td class="eta-time bus-eta">${thirdMinutes} 分鐘</td>
      `;
      busBody.appendChild(tr3);

      updateLastUpdateTime();
    }

    // ========== 更新最後更新時間 ==========
    function updateLastUpdateTime() {
      const now = new Date();
      document.getElementById('last-update').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
    }

    // ========== 初始化 ==========
    setInterval(updateClock, 1000);
    updateClock();

    fetchLRTData();
    fetchB3AData();

    setInterval(fetchLRTData, 10000);
    setInterval(fetchB3AData, 10000);

    window.addEventListener('load', updateLastUpdateTime);
  </script>
</body>
</html>
